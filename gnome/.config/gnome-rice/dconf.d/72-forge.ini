# Ported from PaperWM (70-paperwm.ini) on 2026-08-25.
# NOTE: dump.sh overwrites this file with a raw `dconf dump`, so these comments
# are lost on the next dump. The mapping rationale lives in git history.
#
# Forge is a tree tiler; PaperWM was a scrolling WM. Only the focus/move/resize
# verbs have equivalents. Dropped for lack of any Forge counterpart:
#   switch-first/last, cycle-width/height, toggle-maximize-width, slurp-in,
#   barf-out, toggle-scratch, toggle-scratch-window, center-horizontally.
# Workspace/monitor motion is GNOME's, not Forge's - see 30-wm-keybindings.ini.
[/]

# focus <- PaperWM switch-*
# window-focus-right keeps arrows only: <Super>l is the screen lock in
# 50-media-keys.ini, and Forge's default for this key is <Super>l.
window-focus-left=['<Super>Left', '<Super>h']
window-focus-down=['<Super>Down', '<Super>j']
window-focus-up=['<Super>Up', '<Super>k']
window-focus-right=['<Super>Right']

# move <- PaperWM move-*
window-move-left=['<Super><Shift>Left', '<Super><Shift>h']
window-move-down=['<Super><Shift>Down', '<Super><Shift>j']
window-move-up=['<Super><Shift>Up', '<Super><Shift>k']
window-move-right=['<Super><Shift>Right', '<Super><Shift>l']

# resize <- PaperWM resize-w-* / resize-h-*
window-resize-right-decrease=['<Super>minus']
window-resize-right-increase=['<Super>equal']
window-resize-bottom-decrease=['<Super><Shift>minus']
window-resize-bottom-increase=['<Super><Shift>plus']

# Forge defaults unbound because this rice already claims the combo:
#   <Super>Return    -> Terminal      (50-media-keys.ini custom0)
#   <Shift><Super>s  -> Screenshot UI (40-shell-keybindings.ini)
window-swap-last-active=@as []
con-stacked-layout-toggle=@as []

# <Super>v is Clipboard Indicator's toggle-menu (80-clipboard.ini). Move Forge's
# vertical split off it; horizontal split stays on <Super>z.
con-split-vertical=['<Super><Shift>z']
