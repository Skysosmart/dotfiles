# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

# ───────── Liquid Glass: frosted backdrop blur for quickshell surfaces ─────────
# default namespace covers the top bar + standalone popups (qs -p ...)
layerrule {
    name = "glass-default"
    match:namespace = ^(quickshell)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-volosd"
    match:namespace = ^(volume_osd)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-brightosd"
    match:namespace = ^(brightness_osd)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-master"
    match:namespace = ^(qs-master)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-orb"
    match:namespace = ^(desk-orb)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-popups"
    match:namespace = ^(qs-popups)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-floating"
    match:namespace = ^(qs-floating-overlay)$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = "glass-screenshot"
    match:namespace = ^(qs-screenshot-overlay)$
    blur = on
    ignore_alpha = 0.1
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

# ───────── MASTER QUICKSHELL CONTAINER ─────────
windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}

# ───────── App transparency ─────────
windowrule {
    name = "spotify_opacity"
    match:class = ^(spotify)$
    opacity = 0.70 0.60
}

windowrule {
    name = "vesktop_opacity"
    match:class = ^(vesktop)$
    opacity = 0.70 0.60
}
